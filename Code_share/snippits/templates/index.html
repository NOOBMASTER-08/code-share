<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteCode - Code Sharing App</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Link to CodeMirror for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css">
</head>
<body>
    <main>
        <div class="code-editor-container">
            <div class="note-code">
                <div class="logo-title">
                    <img src="logo.png" alt="NoteCode Logo" class="logo">
                    <h2>Create & Share Your Code easily</h2>
                </div>
                <textarea id="code-editor" placeholder="Write your code here..."></textarea>
            </div>
            <!-- Buttons for language and layout selection -->
            <div class="editor-controls">
                <button onclick="selectLanguage()">HTML</button>
                <button onclick="selectLayout()">Light</button>
            </div>
            <!-- Share button positioned at the bottom right -->
            <button class="share-button" onclick="shareCode()">Share</button>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/mode/xml/xml.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
